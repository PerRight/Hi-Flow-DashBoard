# nginx-uwd.conf — 클라우드 서버 리버스 프록시
#
# 설치:
#   sudo cp deploy/cloud/nginx-uwd.conf /etc/nginx/sites-available/uwd
#   sudo ln -sf /etc/nginx/sites-available/uwd /etc/nginx/sites-enabled/uwd
#   sudo rm -f /etc/nginx/sites-enabled/default     # IPv6 오류 나던 기본 사이트 제거
#   sudo nginx -t && sudo systemctl reload nginx
#
# 이 파일은 HTTP(80) 상태다. certbot 을 돌리면 443 블록과 인증서 경로를
# certbot 이 자동으로 추가해 준다 — 이 파일을 손으로 고치지 말 것.

# WebSocket 업그레이드 헤더 매핑.
# 이게 없으면 /ws/ 요청이 일반 HTTP 로 처리되어 연결이 즉시 끊긴다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen [::]:80;   ← NCP 는 IPv6 미지원. 이 줄을 켜면 nginx 가 기동 실패한다.

    server_name 101.79.22.64.sslip.io;

    # 업로드 없음 — 작게 제한
    client_max_body_size 1m;

    # ── 대시보드 정적 파일 (Vite 빌드 산출물) ────────────────────────────
    root /home/hiflow/app/dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket (대시보드 ↔ 서버, 라즈베리파이 forwarder) ──────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # live 는 1 Hz 라 기본 60초 타임아웃에 걸리지 않지만,
        # LTE 가 끊겨 forwarder 가 조용해지는 구간을 nginx 가 먼저 끊어버리면
        # 서버의 끊김 판정보다 앞서게 된다. 넉넉히 둔다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;          # 실시간 — 버퍼링 금지
    }

    # ── REST (누적 조회·내보내기) ────────────────────────────────────────
    # sites 는 2026-08-29 에 추가된 조사지 자동완성 API 다. 여기 빠뜨리면
    # 요청이 정적 파일 규칙으로 새서 index.html 이 돌아오고, 대시보드는
    # JSON 파싱에 실패해 조사지 목록이 조용히 빈다.
    location ~ ^/(health|surveys|records|export|sites)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
